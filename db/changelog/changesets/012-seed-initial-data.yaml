        # ============================================================
        # PLANTILLAS DE NOTIFICACIÓN
        # ============================================================
        - insert:
            tableName: notification_templates
            columns:
              - column:
                  name: id
                  value: order_confirmation
              - column:
                  name: name
                  value: Confirmación de Orden
              - column:
                  name: type
                  value: email
              - column:
                  name: subject
                  value: Tu orden {{orderNumber}} ha sido confirmada — Queen Arts
              - column:
                  name: body_html
                  value: |
                    <html>
                    <body style="font-family: 'Cormorant Garamond', Georgia, serif; color: #5A4A42;">
                      <h1 style="font-weight: 500;">Tu orden está confirmada</h1>
                      <p>Hola {{customerName}},</p>
                      <p>Hemos recibido tu orden <strong>{{orderNumber}}</strong> por un total de <strong>{{orderTotal}}</strong>.</p>
                      <p>Te enviaremos un correo cuando tu joya esté en camino.</p>
                      <p style="font-style: italic;">Gracias por elegir Queen Arts.</p>
                    </body>
                    </html>
              - column:
                  name: body_text
                  value: |
                    Tu orden está confirmada
                    
                    Hola {{customerName}},
                    
                    Hemos recibido tu orden {{orderNumber}} por un total de {{orderTotal}}.
                    Te enviaremos un correo cuando tu joya esté en camino.
                    
                    Gracias por elegir Queen Arts.
              - column:
                  name: variables
                  value: '["orderNumber", "customerName", "orderTotal"]'

        - insert:
            tableName: notification_templates
            columns:
              - column:
                  name: id
                  value: order_shipped
              - column:
                  name: name
                  value: Orden Enviada
              - column:
                  name: type
                  value: email
              - column:
                  name: subject
                  value: Tu orden {{orderNumber}} está en camino — Queen Arts
              - column:
                  name: body_html
                  value: |
                    <html>
                    <body style="font-family: 'Cormorant Garamond', Georgia, serif; color: #5A4A42;">
                      <h1 style="font-weight: 500;">Tu joya está en camino</h1>
                      <p>Hola {{customerName}},</p>
                      <p>Tu orden <strong>{{orderNumber}}</strong> ha sido enviada.</p>
                      <p>Puedes rastrear tu envío con el número: <strong>{{trackingNumber}}</strong></p>
                      <p><a href="{{trackingUrl}}" style="color: #5A2E48;">Rastrear envío</a></p>
                    </body>
                    </html>
              - column:
                  name: variables
                  value: '["orderNumber", "customerName", "trackingNumber", "trackingUrl"]'

        - insert:
            tableName: notification_templates
            columns:
              - column:
                  name: id
                  value: welcome_user
              - column:
                  name: name
                  value: Bienvenida al newsletter
              - column:
                  name: type
                  value: email
              - column:
                  name: subject
                  value: Bienvenida a Queen Arts — El lenguaje de las joyas
              - column:
                  name: body_html
                  value: |
                    <html>
                    <body style="font-family: 'Cormorant Garamond', Georgia, serif; color: #5A4A42;">
                      <h1 style="font-weight: 500;">Bienvenida a Queen Arts</h1>
                      <p>Hola {{customerName}},</p>
                      <p>Gracias por unirte a nuestra comunidad. Aquí encontrarás joyas con significado, diseñadas en Ecuador para el mundo.</p>
                      <p style="font-style: italic;">El lenguaje de las joyas</p>
                    </body>
                    </html>
              - column:
                  name: variables
                  value: '["customerName"]'

        - insert:
            tableName: notification_templates
            columns:
              - column:
                  name: id
                  value: abandoned_cart
              - column:
                  name: name
                  value: Carrito Abandonado
              - column:
                  name: type
                  value: email
              - column:
                  name: subject
                  value: ¿Olvidaste algo en tu carrito? — Queen Arts
              - column:
                  name: body_html
                  value: |
                    <html>
                    <body style="font-family: 'Cormorant Garamond', Georgia, serif; color: #5A4A42;">
                      <h1 style="font-weight: 500;">¿Olvidaste algo?</h1>
                      <p>Dejaste algunas joyas esperando en tu carrito.</p>
                      <p>Las guardamos por ti. Haz click para completar tu compra.</p>
                      <p><a href="{{cartUrl}}" style="color: #5A2E48;">Ver mi carrito</a></p>
                    </body>
                    </html>
              - column:
                  name: variables
                  value: '["cartUrl"]'

        - insert:
            tableName: notification_templates
            columns:
              - column:
                  name: id
                  value: price_drop_alert
              - column:
                  name: name
                  value: Alerta de Precio Bajo
              - column:
                  name: type
                  value: email
              - column:
                  name: subject
                  value: ¡El precio de {{productName}} bajó!
              - column:
                  name: body_html
                  value: |
                    <html>
                    <body>
                      <h1>¡Buenas noticias!</h1>
                      <p>El producto que estabas esperando bajó de precio:</p>
                      <p><strong>{{productName}}</strong></p>
                      <p>Antes: {{oldPrice}} | Ahora: {{newPrice}}</p>
                      <p><a href="{{productUrl}}">Ver producto</a></p>
                    </body>
                    </html>
              - column:
                  name: variables
                  value: '["productName", "oldPrice", "newPrice", "productUrl"]'

        # ============================================================
        # COLECCIONES INICIALES
        # ============================================================
        - insert:
            tableName: collections
            columns:
              - column:
                  name: id
                  value: col-001
              - column:
                  name: slug
                  value: lenguajes-de-amor
              - column:
                  name: name
                  value: Lenguajes de Amor
              - column:
                  name: type_id
                  value: emotional
              - column:
                  name: tagline
                  value: Porque el amor también habla en plata.
              - column:
                  name: description
                  value: Una colección para quienes expresan lo que sienten a través de lo que llevan.
              - column:
                  name: story
                  value: No todos los lenguajes del amor son verbales. Algunos se llevan puestos, se regalan en momentos especiales, se guardan para siempre. Esta colección celebra todas las formas de amar.
              - column:
                  name: hero_image
                  value: /assets/images/collections/lenguajes-amor/hero.jpg
              - column:
                  name: hero_image_alt
                  value: Colección Lenguajes de Amor — Queen Arts
              - column:
                  name: story_image
                  value: /assets/images/collections/lenguajes-amor/story.jpg
              - column:
                  name: seo_title
                  value: Lenguajes de Amor — Colección Queen Arts
              - column:
                  name: seo_description
                  value: Joyas con significado emocional profundo. Colección Lenguajes de Amor de Queen Arts.
              - column:
                  name: visual_theme
                  value: '{"primaryColor": "#5A2E48", "accentColor": "#CFA6A0", "mood": "Íntimo y emocional", "overlayOpacity": 0.4}'
              - column:
                  name: status
                  value: active
              - column:
                  name: launch_date
                  value: '2025-02-01'

        - insert:
            tableName: collections
            columns:
              - column:
                  name: id
                  value: col-002
              - column:
                  name: slug
                  value: eternal-silver
              - column:
                  name: name
                  value: Eternal Silver
              - column:
                  name: type_id
                  value: aesthetic
              - column:
                  name: tagline
                  value: La plata no pasa de moda. Permanece.
              - column:
                  name: description
                  value: Piezas atemporales en plata .925 para quien no sigue tendencias.
              - column:
                  name: story
                  value: Hay joyas que se compran. Hay joyas que se heredan. Eternal Silver es para quienes piensan en permanencia. Cada pieza está diseñada para vivir más allá de las temporadas.
              - column:
                  name: hero_image
                  value: /assets/images/collections/eternal-silver/hero.jpg
              - column:
                  name: hero_image_alt
                  value: Colección Eternal Silver — Queen Arts
              - column:
                  name: story_image
                  value: /assets/images/collections/eternal-silver/story.jpg
              - column:
                  name: seo_title
                  value: Eternal Silver — Colección Queen Arts
              - column:
                  name: seo_description
                  value: Joyería atemporal en plata .925. Colección Eternal Silver de Queen Arts.
              - column:
                  name: visual_theme
                  value: '{"primaryColor": "#5A4A42", "accentColor": "#D8C3A5", "mood": "Atemporal y mineral", "overlayOpacity": 0.3}'
              - column:
                  name: status
                  value: active
              - column:
                  name: launch_date
                  value: '2025-01-10'

        - insert:
            tableName: collections
            columns:
              - column:
                  name: id
                  value: col-003
              - column:
                  name: slug
                  value: dia-de-la-madre
              - column:
                  name: name
                  value: Día de la Madre 2025
              - column:
                  name: type_id
                  value: temporal
              - column:
                  name: tagline
                  value: Por quien te dio el mundo. Y no pide nada.
              - column:
                  name: description
                  value: Una selección especial para celebrar a mamá.
              - column:
                  name: hero_image
                  value: /assets/images/collections/dia-madre/hero.jpg
              - column:
                  name: hero_image_alt
                  value: Colección Día de la Madre — Queen Arts
              - column:
                  name: seo_title
                  value: Día de la Madre — Regalos Queen Arts
              - column:
                  name: seo_description
                  value: Joyas especiales para el Día de la Madre. Regalos con significado de Queen Arts.
              - column:
                  name: visual_theme
                  value: '{"primaryColor": "#8E6A7D", "accentColor": "#D8B7B0", "mood": "Cálido y gratificante", "overlayOpacity": 0.35}'
              - column:
                  name: status
                  value: upcoming
              - column:
                  name: launch_date
                  value: '2025-05-01'

        # ============================================================
        # RELACIONES ENTRE COLECCIONES
        # ============================================================
        - insert:
            tableName: collection_related
            columns:
              - column:
                  name: collection_id
                  value: col-001
              - column:
                  name: related_collection_id
                  value: col-002
              - column:
                  name: sort_order
                  value: 1

        - insert:
            tableName: collection_related
            columns:
              - column:
                  name: collection_id
                  value: col-001
              - column:
                  name: related_collection_id
                  value: col-003
              - column:
                  name: sort_order
                  value: 2

        - insert:
            tableName: collection_related
            columns:
              - column:
                  name: collection_id
                  value: col-002
              - column:
                  name: related_collection_id
                  value: col-001
              - column:
                  name: sort_order
                  value: 1

      rollback:
        - delete:
            tableName: collection_related
        - delete:
            tableName: collections
        - delete:
            tableName: notification_templates
        - delete:
            tableName: gift_occasions
        - delete:
            tableName: collection_types
        - delete:
            tableName: tags
        - delete:
            tableName: categories
